spring.application.name=estadisticas-service
server.port=8081

# Conexión a la Base de Datos AWS RDS (La misma del catálogo)
# Real credentials come from environment variables (RNF-11). Never commit secrets.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pasteleria_my_dreams?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Kafka local (broker en docker, mismo topic que pedidos-service) - RF-10
spring.kafka.bootstrap-servers=localhost:9092
app.kafka.topic=pedidos